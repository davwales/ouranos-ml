on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # ty checks src/experiments too, so it needs the experiment-only imports to resolve.
      - run: uv sync --group linting --group experiments
      - run: uv run ruff check .
      - run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run pytest --cov=ouranos_ml --cov-report=term-missing --cov-fail-under=80
      # pytest runs without OTel and a broken distro bootstrap fails silently: assert the SDK provider is installed.
      - name: OpenTelemetry bootstrap smoke test
        env:
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_TRACES_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: none
        run: >-
          uv run opentelemetry-instrument python -c
          "import ouranos_ml.main; from opentelemetry import trace; from opentelemetry.sdk.trace import TracerProvider;
          assert isinstance(trace.get_tracer_provider(), TracerProvider), trace.get_tracer_provider()"

  # Version bumps are computed from commit messages, so every commit a PR adds must be a conventional commit.
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: >-
          uv run --only-group dev cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build

  # Builds the image without pushing it, so a broken Dockerfile or dependency fails the PR instead of main's publish.
  # The package is public, so the build cache is readable without logging in, including from Dependabot and forks.
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=cacheonly
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          provenance: false

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # Bursts of auto-merged updates would otherwise race to push :latest. One publish runs at a time, and a newer
    # pending run replaces an older one in whatever order their builds finish, so each run builds the current tip of
    # main rather than its own commit: the last run to publish always ships the newest code.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      packages: write
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # Tag with the commit actually built (the tip of main), not the one that triggered this run.
      - id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

  # A release is a merged `cz bump` commit. main only accepts PRs, so CI can't push bump commits; instead, once the bump
  # reaches main, this tags the commit publish just built and gives its image the version tag, so nothing is rebuilt.
  # It tags main's tip rather than the bump commit because GITHUB_TOKEN can't create a tag on a commit whose workflow
  # files differ from main's. The git tag is pushed last, so a failed run leaves the version untagged for a re-run.
  release:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
      - id: version
        name: Find the version to release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version already exists, nothing to release"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version
        uses: docker/setup-buildx-action@v4
      - if: steps.version.outputs.version
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.version
        name: Tag the image
        run: >-
          docker buildx imagetools create
          --tag "$IMAGE:${{ steps.version.outputs.version }}"
          "$IMAGE:sha-${{ needs.publish.outputs.short_sha }}"
      - if: steps.version.outputs.version
        name: Push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"
