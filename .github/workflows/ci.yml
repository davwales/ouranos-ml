on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group linting
      - run: uv run ruff check .
      - run: uv run ty check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run pytest --cov=ouranos_ml --cov-report=term-missing --cov-fail-under=80
      # pytest runs without OTel and a broken distro bootstrap fails silently: assert the SDK provider is installed.
      - name: OpenTelemetry bootstrap smoke test
        env:
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_TRACES_EXPORTER: otlp
          OTEL_METRICS_EXPORTER: none
        run: >-
          uv run opentelemetry-instrument python -c
          "import ouranos_ml.main; from opentelemetry import trace; from opentelemetry.sdk.trace import TracerProvider;
          assert isinstance(trace.get_tracer_provider(), TracerProvider), trace.get_tracer_provider()"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # Bursts of auto-merged updates would otherwise race to push :latest. One publish runs at a time, and a newer
    # pending run replaces an older one in whatever order their builds finish, so each run builds the current tip of
    # main rather than its own commit: the last run to publish always ships the newest code.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache,mode=max
          provenance: false
