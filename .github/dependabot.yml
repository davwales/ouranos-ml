version: 2

# Minor/patch updates auto-merge via .github/workflows/dependabot-automerge.yml once required checks pass.
# Majors, torch minors and all Docker updates are labelled manual-merge and left for a human.
updates:
  - package-ecosystem: uv
    directory: /
    # Keep the ~=X.Y.0 pins; the default widens them into >=X.Y,<X.Z ranges.
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      # Contrib (0.Xb0) and core (1.Y) release in lockstep and instrumentations pin exact versions,
      # so every update type is grouped; a group containing a major becomes a manual merge.
      opentelemetry:
        patterns: ["opentelemetry-*"]
      web:
        patterns: [fastapi, starlette, pydantic, "pydantic-*", uvicorn, httpx, websockets]
        update-types: [minor, patch]
      scientific:
        patterns: [numpy, polars, scikit-learn, matplotlib]
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: build(docker)
    # The base image's Python minor follows .python-version, so only take patch releases.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    labels: [dependencies]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
