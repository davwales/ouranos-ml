info:
  name: Completions (Function Tools)
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "{{MODEL}}",
        "messages": [
          {
            "role": "user",
            "content": "What's the weather in Paris?"
          },
          {
            "role": "assistant",
            "content": null,
            "tool_calls": [
              {
                "id": "call_1",
                "type": "function",
                "function": {
                  "name": "get_weather",
                  "arguments": "{\"city\":\"Paris\"}"
                }
              }
            ]
          },
          {
            "role": "tool",
            "tool_call_id": "call_1",
            "content": "{\"temp_c\":18,\"conditions\":\"sunny\"}"
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "get_weather",
              "description": "Get the current weather for a city.",
              "parameters": {
                "type": "object",
                "properties": {
                  "city": {
                    "type": "string"
                  }
                },
                "required": [
                  "city"
                ],
                "additionalProperties": false
              }
            }
          }
        ],
        "tool_choice": "auto",
        "stream": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
