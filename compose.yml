# Local telemetry: Grafana with Loki (logs), Tempo (traces) and Prometheus (metrics) in one container.
# Run the app from source against it with `uv run --env-file telemetry.env opentelemetry-instrument ouranos_ml`.
# Production runs from deploy/ouranos-ml.container instead.
services:
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.38.1
    ports:
      - "3001:3000" # Grafana (admin/admin); 3000 is often taken by pantheon's interface
      - "3100:3100" # Loki push API (LOKI_BASE_URL)
      - "4318:4318" # OTLP/HTTP (OTEL_EXPORTER_OTLP_ENDPOINT)
