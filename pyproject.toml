[project]
name = "ouranos-ml"
version = "0.1.0"
description = "Machine learning functionality for all Ouranos projects."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
"fastapi~=0.141.0",
    "matplotlib~=3.11.0",
    "numpy~=2.5.0",
    "openai~=2.37.0",
    "pandas~=2.3.0",
    "pydantic-settings~=2.15.0",
    "scikit-learn~=1.9.0",
    "torch~=2.12.0",
    "uvicorn~=0.52.0",
]


[dependency-groups]
dev = ["commitizen>=4.13.10"]
linting = ["ruff>=0.14.13", "ty>=0.0.12"]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.0.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[project.scripts]
start = "ouranos_ml.main:main"
ouranos_ml = "ouranos_ml.main:main"
experiment = "experiments.main:main"

[build-system]
requires = ["uv_build~=0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    'F',      # Pyflakes
    'E',      # pycodestyle (Error)
    'I',      # isort
    'D',      # pydocstyle
    'UP',     # pyupgrade
    'YTT',    # flake8-2020
    'B',      # flake8-bugbear
    'T10',    # flake8-debugger
    'T20',    # flake8-print
    'C4',     # flake8-comprehensions
    'PERF',   # Perflint
    'PIE',    # flake8-pie
    'PYI006', # flake8-pyi
    'PYI062', # flake8-pyi
    'PYI063', # flake8-pyi
    'PYI066', # flake8-pyi
    'ANN',    # Type hinting
    "TID",    # flake8-tidy-imports
]
ignore = [
    'D100',
    'D104',
    'D105',
    'D107',
    'D205',
    'D415',
    'E501',
    'B011',
    'B028',
    'B904',
    'PIE804',
]
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
isort = { known-first-party = ['pydantic', 'tests'] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.ruff.format]
quote-style = 'double'

[tool.ruff.lint.extend-per-file-ignores]
"*/router.py" = ["F401", "E402"]
"test_*.py" = ["D103", "ANN"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ty.src]
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/ouranos_ml"]
omit = ["src/experiments/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
